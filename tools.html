<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 防放大：限制缩放视角 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>导航栏可视化编辑器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 16px 60px;
      background: #eef2f5;
      color: #333;
    }
    h2 { text-align: center; color: #235085; margin-bottom: 24px; font-size: 1.6rem; }
    
    /* 移动端 input/select/textarea 字号 >= 16px 防止自动放大 */
    input, select, textarea {
      font-size: 16px !important;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #235085;
    }

    /* 整体卡片样式 */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      border-left: 6px solid #235085;
    }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 14px;
      margin-bottom: 20px;
    }
    .card-title { font-weight: bold; font-size: 1.25rem; color: #235085; }
    
    .btn-danger {
      background: #ef4444;
      color: #fff;
      border: 0;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-danger:hover { background: #dc2626; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .full { grid-column: span 2; }
    
    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #475569;
    }
    
    /* 链接区块隔离样式 */
    .sub-box {
      padding: 18px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-top: 8px;
    }
    .sub-box-1 {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }
    .sub-box-2 {
      background: #f0f9ff;
      border-color: #bae6fd;
    }
    
    .sub-title {
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sub-box-1 .sub-title { color: #15803d; }
    .sub-box-2 .sub-title { color: #0369a1; }
    
    .action-btns { display: flex; gap: 12px; margin-bottom: 24px; }
    .btn-main {
      background: #16a34a;
      color: white;
      border: 0;
      padding: 14px;
      font-size: 1.05rem;
      border-radius: 8px;
      cursor: pointer;
      flex: 1;
      font-weight: bold;
    }
    .btn-add {
      background: #235085;
      color: white;
      border: 0;
      padding: 14px;
      font-size: 1.05rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-auto-fetch {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-bottom: 12px;
    }
    .btn-copy {
      background: #0284c7;
      color: white;
      border: 0;
      padding: 10px 18px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
    }
    
    textarea {
      height: 140px;
      font-family: monospace;
      line-height: 1.4;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .full { grid-column: span 1; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>

  <h2>导航栏可视化编辑器</h2>

  <!-- 导入区 -->
  <div class="card" style="background: #f8fafc; border-left-color: #64748b;">
    <span class="card-title" style="color: #475569;">📥 导入已有配置</span>
    <p style="font-size: 0.85rem; color: #64748b; margin: 8px 0 12px;">已部署在同目录时，直接点击下方按钮可自动一键获取：</p>
    
    <button class="btn-auto-fetch" onclick="fetchLocalJS()">🔄 一键读取同目录 auto-update.js</button>

    <details style="margin-top: 10px;">
      <summary style="cursor: pointer; color: #64748b; font-size: 0.85rem;">手动粘贴文本导入（备用）</summary>
      <textarea id="importCode" placeholder="在此粘贴 auto-update.js 代码..." style="margin-top: 8px;"></textarea>
      <button class="btn-add" onclick="importJS()" style="margin-top: 8px; width: 100%; background: #475569; padding: 10px;">解析输入的代码</button>
    </details>
  </div>

  <!-- 编辑区 -->
  <div id="navContainer"></div>

  <div class="action-btns">
    <button class="btn-add" onclick="addNavCard()">+ 新增导航按钮</button>
    <button class="btn-main" onclick="generateJS()">⚡ 生成 auto-update.js</button>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h3>导出结果：</h3>
    <button class="btn-copy" onclick="copyJS()">📋 一键复制 JS 代码</button>
  </div>
  <textarea id="outputCode" readonly placeholder="点击上方生成按钮后，此处将生成 JS 代码..."></textarea>

  <script>
    // 动态计算“第二天凌晨0点”的标准字符串 (YYYY/MM/DD 00:00:00)
    function getTomorrowZeroStandardString() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}/${month}/${day} 00:00:00`;
    }

    // 计算 datetime-local 显示格式 (YYYY-MM-DDTHH:mm)
    function getTomorrowZeroPickerString() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}T00:00`;
    }

    // 转换到 datetime-local 控件格式（若传入为空，则补上第二天凌晨0点）
    function formatToPickerValue(timeStr) {
      if (!timeStr) return getTomorrowZeroPickerString();
      const formatted = timeStr.replace(/\//g, '-').replace(' ', 'T');
      return formatted.length >= 16 ? formatted.substring(0, 16) : getTomorrowZeroPickerString();
    }

    // 转换为标准时间格式保存 (YYYY/MM/DD HH:mm:ss)
    function formatToStandardTime(pickerStr) {
      if (!pickerStr) return getTomorrowZeroStandardString();
      const [date, time] = pickerStr.split('T');
      const [year, month, day] = date.split('-');
      return `${year}/${month}/${day} ${time}:00`;
    }

    // 初始化数据，链接1和链接2的时间统一预设为第二天凌晨0点
    const defaultTomorrowTime = getTomorrowZeroStandardString();

    let navData = [
      {
        id: "btn-1",
        text: "🎞全国最大交流总群.免费 →",
        visible: "1",
        link1: { url: "https://khxm7iv3ws-hhhkg.oss-cn-wulanchabu.aliyuncs.com/uls-2b7pdd-4p/z-xr-u4/tL-Psr?d=iGxzV4c6&e=1&J0WAjeQ=4D4BwiAuCLPQm6&ts=1789405952159", mode: "1", time: defaultTomorrowTime },
        link2: { url: "https://example.com/new-link-1", mode: "0", time: defaultTomorrowTime }
      },
      {
        id: "btn-2",
        text: "🎞 亲测校园免费通道→不一样 →",
        visible: "1",
        link1: { url: "https://mr-0ocw87f-bax8np1n6qa.oss-cn-guangzhou.aliyuncs.com/cpha/y-1dza/Updt?d=Ni6qnPs9&e=1&Y4aFnkle=QCYGwKGHM4of&ts=1789405953422", mode: "1", time: defaultTomorrowTime },
        link2: { url: "https://example.com/new-link-2", mode: "0", time: defaultTomorrowTime }
      },
      {
        id: "btn-3",
        text: "🎞 这个最全~各种搞笑视频→",
        visible: "1",
        link1: { url: "https://zhn3br4w-n9.oss-cn-wulanchabu.aliyuncs.com/in8el-39no2/va-6pjw6/q-ABjXLcZUi?d=yPnT1MjZ&e=1&eTuXHTT=jmSi2Ay&ts=1789405954720", mode: "1", time: defaultTomorrowTime },
        link2: { url: "", mode: "0", time: defaultTomorrowTime }
      }
    ];

    window.onload = function() {
      renderCards();
      fetchLocalJS(true);
    };

    function renderCards() {
      const container = document.getElementById('navContainer');
      container.innerHTML = '';
      navData.forEach((item, index) => {
        const l1TimeValue = formatToPickerValue(item.link1.time);
        const l2TimeValue = formatToPickerValue(item.link2.time);

        container.innerHTML += `
          <div class="card" data-index="${index}">
            <div class="card-header">
              <span class="card-title">📌 导航按钮 #${index + 1} (${item.id})</span>
              <button class="btn-danger" onclick="removeCard(${index})">🗑 删除导航</button>
            </div>
            <div class="grid">
              <div>
                <label>按钮 ID</label>
                <input type="text" class="field-id" value="${item.id}">
              </div>
              <div>
                <label>显示状态</label>
                <select class="field-visible">
                  <option value="1" ${item.visible === '1' ? 'selected' : ''}>👁 显示 (1)</option>
                  <option value="0" ${item.visible === '0' ? 'selected' : ''}>🙈 隐藏 (0)</option>
                </select>
              </div>
              <div class="full">
                <label>按钮显示文字</label>
                <input type="text" class="field-text" value="${item.text}">
              </div>
              
              <!-- 链接 1 区块 -->
              <div class="full sub-box sub-box-1">
                <span class="sub-title">🔗 配置：链接 1（默认/基础链接）</span>
                <label>URL 跳转地址</label>
                <input type="text" class="field-l1-url" value="${item.link1.url}">
                <div class="grid" style="margin-top:12px;">
                  <div>
                    <label>触发模式 (Mode)</label>
                    <select class="field-l1-mode">
                      <option value="1" ${item.link1.mode === '1' ? 'selected' : ''}>1 - 无视时间直接生效</option>
                      <option value="0" ${item.link1.mode === '0' ? 'selected' : ''}>0 - 需满足预设时间</option>
                    </select>
                  </div>
                  <div>
                    <label>预设生效时间（日历选择）</label>
                    <input type="datetime-local" class="field-l1-time" value="${l1TimeValue}">
                  </div>
                </div>
              </div>

              <!-- 链接 2 区块 -->
              <div class="full sub-box sub-box-2">
                <span class="sub-title">⏱ 配置：链接 2（定时/新替换链接）</span>
                <label>URL 跳转地址</label>
                <input type="text" class="field-l2-url" value="${item.link2.url}">
                <div class="grid" style="margin-top:12px;">
                  <div>
                    <label>触发模式 (Mode)</label>
                    <select class="field-l2-mode">
                      <option value="1" ${item.link2.mode === '1' ? 'selected' : ''}>1 - 无视时间直接生效</option>
                      <option value="0" ${item.link2.mode === '0' ? 'selected' : ''}>0 - 需满足预设时间</option>
                    </select>
                  </div>
                  <div>
                    <label>预设生效时间（日历选择）</label>
                    <input type="datetime-local" class="field-l2-time" value="${l2TimeValue}">
                  </div>
                </div>
              </div>

            </div>
          </div>
        `;
      });
    }

    function collectData() {
      const cards = document.querySelectorAll('#navContainer .card');
      const newData = [];
      cards.forEach(card => {
        newData.push({
          id: card.querySelector('.field-id').value.trim(),
          text: card.querySelector('.field-text').value,
          visible: card.querySelector('.field-visible').value,
          link1: {
            url: card.querySelector('.field-l1-url').value.trim(),
            mode: card.querySelector('.field-l1-mode').value,
            time: formatToStandardTime(card.querySelector('.field-l1-time').value)
          },
          link2: {
            url: card.querySelector('.field-l2-url').value.trim(),
            mode: card.querySelector('.field-l2-mode').value,
            time: formatToStandardTime(card.querySelector('.field-l2-time').value)
          }
        });
      });
      return newData;
    }

    function addNavCard() {
      navData = collectData();
      const newId = `btn-${navData.length + 1}`;
      const tomorrowStr = getTomorrowZeroStandardString();
      navData.push({
        id: newId,
        text: "🎞 新按钮标题 →",
        visible: "1",
        link1: { url: "", mode: "1", time: tomorrowStr },
        link2: { url: "", mode: "0", time: tomorrowStr }
      });
      renderCards();
    }

    function removeCard(index) {
      navData = collectData();
      navData.splice(index, 1);
      renderCards();
    }

    function generateJS() {
      const data = collectData();
      const code = `/* --- AUTO GENERATED CONFIG --- */
const navConfigs = ${JSON.stringify(data, null, 2)};

document.addEventListener('DOMContentLoaded', function() {
  const menuBox = document.querySelector('.menu');
  if (!menuBox) return;

  menuBox.innerHTML = '';
  const now = Date.now();

  navConfigs.forEach(item => {
    if (item.visible === '0') return;

    const btn = document.createElement('button');
    btn.id = item.id;
    btn.className = 'btn';
    btn.innerText = item.text;

    let targetUrl = '';

    const checkLinkValid = (linkObj) => {
      if (!linkObj || !linkObj.url) return false;
      if (linkObj.mode == '1') return true;
      if (linkObj.mode == '0' && linkObj.time) {
        const targetStamp = new Date(\`\${linkObj.time.replace(/-/g, '/')} GMT+0800\`).getTime();
        return now >= targetStamp;
      }
      return false;
    };

    if (checkLinkValid(item.link2)) {
      targetUrl = item.link2.url;
    } else if (checkLinkValid(item.link1)) {
      targetUrl = item.link1.url;
    }

    btn.onclick = function() {
      if (targetUrl && typeof window.go === 'function') {
        window.go(targetUrl);
      }
    };

    menuBox.appendChild(btn);
  });
});`;

      document.getElementById('outputCode').value = code;
    }

    function copyJS() {
      const textarea = document.getElementById('outputCode');
      if (!textarea.value) {
        alert('请先点击“⚡ 生成 auto-update.js”按钮！');
        return;
      }
      textarea.select();
      navigator.clipboard.writeText(textarea.value).then(() => {
        alert('已成功复制 JS 代码到剪贴板！');
      }).catch(() => {
        document.execCommand('copy');
        alert('已成功复制 JS 代码！');
      });
    }

    function fetchLocalJS(isSilent = false) {
      fetch('auto-update.js?t=' + Date.now())
        .then(res => {
          if (!res.ok) throw new Error('未找到 auto-update.js');
          return res.text();
        })
        .then(text => {
          parseAndLoadJS(text, !isSilent);
        })
        .catch(err => {
          if (!isSilent) {
            alert('读取失败：未找到同目录下的 auto-update.js，或当前环境不支持本地 HTTP 协议。');
          }
        });
    }

    function parseAndLoadJS(rawText, showNotice = true) {
      const match = rawText.match(/const navConfigs = (\[[\s\S]*?\]);/);
      if (match && match[1]) {
        try {
          navData = JSON.parse(match[1]);
          renderCards();
          if (showNotice) alert('已成功读取并载入同目录的 auto-update.js 配置！');
        } catch (e) {
          if (showNotice) alert('解析失败：JSON 格式异常');
        }
      } else {
        if (showNotice) alert('未在脚本中找到有效的 navConfigs 变量！');
      }
    }

    function importJS() {
      const raw = document.getElementById('importCode').value;
      parseAndLoadJS(raw, true);
    }
  </script>
</body>
</html>
