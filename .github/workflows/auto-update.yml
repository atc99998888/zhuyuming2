name: 全能定时更新 index.html 导航配置

on:
  schedule:
    # 自动换算对应的 UTC 时间 (北京时间 2026-09-17 22:42)
    - cron: '42 14 17 9 *'
  workflow_dispatch:

jobs:
  auto-rewrite-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 执行 DOM 自动化修改
        run: |
          node -e '
            const fs = require("fs");
            const { JSDOM } = require("jsdom"); // 依赖 jsdom 库处理全量 HTML 解析

            // 1. 安装临时解析环境
            const execSync = require("child_process").execSync;
            try { require("jsdom"); } catch (e) {
              console.log("正在安装 HTML 解析库...");
              execSync("npm install jsdom");
            }

            const { JSDOM } = require("jsdom");
            let htmlContent = fs.readFileSync("index.html", "utf8");
            const dom = new JSDOM(htmlContent);
            const document = dom.window.document;

            // 预设配置项
            const tasks = [
          {
                    "id": "btn-1",
                    "text": ">        🎞全国最大交流总群.免费 →",
                    "url": "https://cyberpolice.mps.gov.cn",
                    "status": "show",
                    "isNew": false
          }
];

            let hasChanged = false;

            tasks.forEach(task => {
              let el = document.getElementById(task.id);

              // 1. 删除节点逻辑
              if (task.status === "delete") {
                if (el) {
                  el.remove();
                  hasChanged = true;
                  console.log(`[删除] 成功移除 ID: ${task.id} 的导航按钮`);
                }
                return;
              }

              // 2. 如果是新增的节点且不存在，则在页面末尾或容器中创建
              if (!el && task.isNew) {
                el = document.createElement("button");
                el.id = task.id;
                el.className = "btn"; // 保留原样式类
                
                // 找到第一个按钮的父容器插入
                const firstBtn = document.querySelector("button");
                if (firstBtn && firstBtn.parentNode) {
                  firstBtn.parentNode.appendChild(el);
                } else {
                  document.body.appendChild(el);
                }
                hasChanged = true;
                console.log(`[新增] 成功创建新导航按钮 ID: ${task.id}`);
              }

              if (el) {
                // 修改跳转链接与 onclick
                el.setAttribute("onclick", `go('${task.url}')`);
                
                // 修改文本内容
                if (el.textContent !== task.text) {
                  el.textContent = task.text;
                  hasChanged = true;
                }

                // 显隐逻辑处理
                if (task.status === "hide") {
                  el.style.display = "none";
                  hasChanged = true;
                } else if (task.status === "show") {
                  if (el.style.display === "none") {
                    el.style.display = "";
                    hasChanged = true;
                  }
                }
                console.log(`[更新] 按钮 ${task.id} 配置更新成功`);
              }
            });

            if (hasChanged) {
              fs.writeFileSync("index.html", dom.serialize(), "utf8");
              console.log("index.html 全量更新保存成功！");
            } else {
              console.log("无可变更内容。");
            }
          '

      - name: 自动提交修改回 GitHub 仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain) ]]; then
            git add index.html
            git commit -m "chore: 预设时间已到，全能修改 index.html 导航与链接"
            git push
          else
            echo "没有任何变更，跳过提交"
          fi
