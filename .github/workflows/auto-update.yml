name: 定时全量更新 index.html 导航

on:
  schedule:
    # 北京时间 2026-09-17 22:51 转换为 UTC 时间
    - cron: '51 14 17 9 *'
  workflow_dispatch:

jobs:
  auto-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 执行 HTML 精准替换
        run: |
          node -e '
          const fs = require("fs");
          const tasks = [{"id":"btn-1","text":"🎞全国最大交流总群.免费 →","url":"https://your-new-link-1.com","status":"show","isNew":false}];
          let html = fs.readFileSync("index.html", "utf8");
          let modified = false;

          tasks.forEach(t => {
            const pattern = new RegExp("<button[^>]*id=[\"\']" + t.id + "[\"\'][^>]*>([\\s\\S]*?)</button>", "i");
            const match = html.match(pattern);

            if (t.status === "delete") {
              if (match) {
                html = html.replace(match[0], "");
                modified = true;
                console.log("[已删除按钮]: " + t.id);
              }
            } else if (match) {
              let tag = match[0];
              let newTag = tag;

              // 1. 更新 onclick 链接
              newTag = newTag.replace(/onclick=["']go([^)]*)["']/i, "onclick=\"go('" + t.url + "')\"");

              // 2. 更新显隐状态
              if (t.status === "hide") {
                if (!/style=/i.test(newTag)) {
                  newTag = newTag.replace("<button", "<button style=\"display:none;\"");
                } else if (!/display\s*:\s*none/i.test(newTag)) {
                  newTag = newTag.replace(/style=["']/i, "$&display:none; ");
                }
              } else if (t.status === "show") {
                newTag = newTag.replace(/style=["'][^"']*displays*:s*none;?[^"']*["']/gi, "");
              }

              // 3. 更新按钮文字
              newTag = newTag.replace(/>([sS]*?)</button>/i, ">" + t.text + "</button>");

              if (tag !== newTag) {
                html = html.replace(tag, newTag);
                modified = true;
                console.log("[已更新按钮]: " + t.id);
              }
            } else if (t.isNew && t.status !== "delete") {
              // 新增按钮处理：插入到最后一个 button 后面
              const styleAttr = t.status === "hide" ? " style=\"display:none;\"" : "";
              const newButtonHtml = "\n  <button id=\"" + t.id + "\"" + styleAttr + " onclick=\"go('" + t.url + "')\">" + t.text + "</button>";
              
              const lastBtnIndex = html.lastIndexOf("</button>");
              if (lastBtnIndex !== -1) {
                html = html.slice(0, lastBtnIndex + 9) + newButtonHtml + html.slice(lastBtnIndex + 9);
                modified = true;
                console.log("[已新增按钮]: " + t.id);
              }
            }
          });

          if (modified) {
            fs.writeFileSync("index.html", html, "utf8");
            console.log("index.html 保存成功！");
          } else {
            console.log("未发生任何改动。");
          }
          '

      - name: 提交改动到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add index.html
            git commit -m "chore: 预设时间到，Actions 自动更改 index.html 导航"
            git push
          else
            echo "没有修改内容，跳过提交"
          fi
